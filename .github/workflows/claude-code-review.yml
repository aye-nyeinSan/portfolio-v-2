name: Claude Code Review

# Automatic Claude review on every non-draft pull request.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Forks don't get repo secrets, so skip them along with drafts.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review PR
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first for project conventions.

            Focus on:
            - Bugs and broken behavior (rendering, hydration, data fetching, routing)
            - React / Next.js App Router best practices and performance
              (see .agents/skills/vercel-react-best-practices for the rules this repo follows)
            - Accessibility and responsive layout regressions
            - Security issues (leaked secrets, unsafe API route handling)

            Use inline comments for specific issues and one top-level summary comment.
            Be concise; skip praise and nitpicks that a linter would catch.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
