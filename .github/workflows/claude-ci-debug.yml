name: Claude CI Debug

# When CI fails on a pull request, Claude reads the failed logs and posts a
# diagnosis comment on the PR. Claude only reads: it runs no build commands and
# pushes nothing. To have it apply the fix, reply on the PR with "@claude fix it"
# (handled by claude.yml).
#
# workflow_run always uses the copy of this file on the default branch, so
# changes here take effect only after they are merged.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  diagnose:
    # Same-repo PRs only: fork PRs don't populate pull_requests.
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read # read the failed run's logs
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Diagnose CI failure
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
            FAILED RUN: ${{ github.event.workflow_run.html_url }}
            RUN ID: ${{ github.event.workflow_run.id }}

            The CI workflow failed on this pull request. Read CLAUDE.md for project context.

            1. Run `gh run view ${{ github.event.workflow_run.id }} --log-failed` to read the failing step's logs.
            2. Run `gh pr diff ${{ github.event.workflow_run.pull_requests[0].number }}` and read the relevant source files to find the root cause.
            3. Post ONE comment on the PR with `gh pr comment` containing:
               - Which job and step failed, with the key error lines in a code block
               - The root cause, with file paths and line numbers
               - The concrete fix (a short diff or code snippet)
               - Whether the failure looks caused by this PR or is pre-existing / flaky
               - A last line: "Reply `@claude fix it` to have Claude push this fix."

            Do not modify files or push commits. Keep the comment concise.
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Bash(gh run view:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
